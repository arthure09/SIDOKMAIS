services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidokmais
      POSTGRES_PASSWORD: sidokmais
      POSTGRES_DB: sidokmais
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidokmais"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://sidokmais:sidokmais@db:5432/sidokmais?schema=public"
      # `:?` = compose menolak start kalau JWT_SECRET belum di-set. Sebelumnya
      # baris ini punya nilai bawaan yang ikut ter-commit di repo, jadi stack
      # yang lupa mengisinya tetap menyala — menandatangani token dengan kunci
      # yang bisa dibaca siapa pun. Lebih baik gagal berisik daripada aman-aman
      # palsu. Nilainya diambil dari backend/.env (tidak ter-commit).
      # Dikutip: pesan errornya tidak boleh mengandung ": " — YAML membacanya
      # sebagai mapping baru dan seluruh file gagal di-parse.
      JWT_SECRET: "${JWT_SECRET:?wajib di-set, generate dengan openssl rand -base64 48}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      # Sumber data modul Pasien/Operasi/Konsultasi. Default "dummy" lewat
      # `:-`, jadi stack yang tidak mengisi apa-apa tetap jalan dengan data
      # seed seperti sebelumnya — menyalakan mode SIMRS harus disengaja.
      SUMBER_DATA: ${SUMBER_DATA:-dummy}
      # Kredensial replika SIMRS (read-only). Kosong kalau SUMBER_DATA=dummy;
      # server baru menuntutnya saat mode simrs benar-benar dipakai. Nilainya
      # dari backend/.env, tidak pernah ditulis di file ini — sama seperti
      # JWT_SECRET.
      SIMRS_HOST: ${SIMRS_HOST:-}
      SIMRS_PORT: ${SIMRS_PORT:-3306}
      SIMRS_USER: ${SIMRS_USER:-}
      SIMRS_PASSWORD: ${SIMRS_PASSWORD:-}
      SIMRS_POOL_LIMIT: ${SIMRS_POOL_LIMIT:-5}
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  db_data:
